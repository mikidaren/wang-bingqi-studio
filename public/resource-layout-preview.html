<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>云资源 · 布局检查</title>
  <style>
    body{margin:0;padding:24px;background:#dfe7e8;color:#203133;font-family:system-ui,sans-serif}
    h1{font-size:18px;margin:0 0 8px}p{font-size:13px;margin:0 0 20px}
    main{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
    section{flex:none}h2{font-size:13px;font-weight:500}
    iframe{display:block;border:1px solid #b7c5c8;border-radius:12px;height:1080px;background:#edf3f3}
    #mobile-preview{width:390px}#small-preview{width:360px}#desktop-preview{width:1280px;height:1000px}
  </style>
</head>
<body>
  <h1>云资源 · 布局检查</h1>
  <p>预览专用。390px、360px 与 1280px 响应式检查。</p>
  <main>
    <section><h2>390px 手机</h2><iframe id="mobile-preview" title="390px 手机预览" src="/category/process/"></iframe></section>
    <section><h2>360px 手机</h2><iframe id="small-preview" title="360px 手机预览" src="/category/process/"></iframe></section>
    <section><h2>1280px 桌面</h2><iframe id="desktop-preview" title="1280px 桌面预览" src="/category/process/"></iframe></section>
  </main>
</body>
</html>
